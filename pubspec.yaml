name: veloshop
description: "A new Flutter project."

publish_to: 'none'

version: 0.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
   - assets/img/
   - assets/icons/
   - assets/svg/



  fonts:
    - family: dana
      fonts:
        - asset: assets/fonts/dana-300.ttf
          weight: 300
        - asset: assets/fonts/dana-400.ttf
          weight: 400
        - asset: assets/fonts/dana-500.ttf
          weight: 500

    - family: vazir
      fonts:
        - asset: assets/fonts/Vazirmatn-Medium.ttf

    - family: estedad
      fonts:
        - asset: assets/fonts/Estedad-Medium.ttf

    - family: tanha
      fonts:
        - asset: assets/fonts/Tanha.ttf


